name: Regenerar moderno desde Marlin limpio

on:
  push:
    branches: [ auditoria-final-sirius ]
    paths:
      - '.github/workflows/regenerar-moderno-limpio.yml'
      - '02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/migrar_configuracion.py'

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar Configuration desde upstream oficial 2.1.2.8
        shell: bash
        run: |
          set -euxo pipefail
          MARLIN_COMMIT='1cd56c4ccd483045eb5a92c99e3ad3b5ab1bea6d'
          git init /tmp/upstream
          git -C /tmp/upstream remote add origin https://github.com/MarlinFirmware/Marlin.git
          git -C /tmp/upstream fetch --depth 1 origin "$MARLIN_COMMIT"
          git -C /tmp/upstream checkout --detach FETCH_HEAD
          M='02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8/Marlin'
          cp /tmp/upstream/Marlin/Configuration.h "$M/Configuration.h"
          cp /tmp/upstream/Marlin/Configuration_adv.h "$M/Configuration_adv.h"

      - name: Aplicar migrador Sirius corregido
        run: python3 02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/migrar_configuracion.py

      - name: Probar idempotencia exacta
        shell: bash
        run: |
          set -euxo pipefail
          M='02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8/Marlin'
          cp "$M/Configuration.h" /tmp/Configuration.h
          cp "$M/Configuration_adv.h" /tmp/Configuration_adv.h
          python3 02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/migrar_configuracion.py
          cmp "$M/Configuration.h" /tmp/Configuration.h
          cmp "$M/Configuration_adv.h" /tmp/Configuration_adv.h

      - name: Instalar PlatformIO y compilar
        run: |
          python3 -m pip install platformio
          cd 02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8
          platformio run -e mega2560

      - name: Regenerar HEX y checksum
        shell: bash
        run: |
          set -euxo pipefail
          DIR='02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300'
          cp "$DIR/Marlin-2.1.2.8/.pio/build/mega2560/firmware.hex" "$DIR/firmware/SIRIUS-300x300-IDEX-Marlin-2.1.2.8-RUMBA-TMC2209-standalone.hex"
          (cd "$DIR/firmware" && sha256sum SIRIUS-300x300-IDEX-Marlin-2.1.2.8-RUMBA-TMC2209-standalone.hex > SHA256SUMS.txt)

      - name: Guardar regeneración limpia
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8/Marlin/Configuration.h
          git add 02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8/Marlin/Configuration_adv.h
          git add 02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/firmware/
          if ! git diff --cached --quiet; then
            git commit -m 'Regenera configuración moderna desde Marlin 2.1.2.8 limpio'
            git push origin HEAD:auditoria-final-sirius
          fi
