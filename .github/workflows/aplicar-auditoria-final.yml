name: Aplicar auditoria final Sirius

on:
  push:
    branches: [ auditoria-final-sirius ]
    paths:
      - '02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/migrar_configuracion.py'
      - '.github/workflows/aplicar-auditoria-final.yml'

permissions:
  contents: write

jobs:
  auditar-corregir-compilar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar migracion moderna canonica
        run: python3 02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/migrar_configuracion.py

      - name: Verificar LEGACY contra fuente publica Moebyus
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Moebyus/Firmwares.git /tmp/moebyus
          LOCAL='01-LEGACY-MARLIN-1.1.1-CAMA-300x300/Marlin'
          ORIG='/tmp/moebyus/SIRIUS11/SIRIUS11-Rumba-MK8-XYGT2-ZHusillo-lcdFull/Marlin'
          diff -qr --exclude='Configuration.h' --exclude='Configuration.h.orig' "$LOCAL" "$ORIG"
          python3 - <<'PY'
          from pathlib import Path
          import re

          local = Path('01-LEGACY-MARLIN-1.1.1-CAMA-300x300/Marlin/Configuration.h').read_text(encoding='utf-8')
          orig = Path('/tmp/moebyus/SIRIUS11/SIRIUS11-Rumba-MK8-XYGT2-ZHusillo-lcdFull/Marlin/Configuration.h').read_text(encoding='utf-8')
          allowed = {'STRING_CONFIG_H_AUTHOR', 'CUSTOM_MACHINE_NAME', 'Y_MAX_POS'}

          def active(text):
              out = []
              for line in text.splitlines():
                  m = re.match(r'^\s*#define\s+([A-Za-z0-9_]+)(?:\s+(.*?))?\s*$', line)
                  if m and m.group(1) not in allowed:
                      out.append((m.group(1), (m.group(2) or '').strip()))
              return out

          if active(local) != active(orig):
              a, b = active(local), active(orig)
              for i, (x, y) in enumerate(zip(a, b)):
                  if x != y:
                      print('Primera diferencia no permitida:', i, 'LOCAL=', x, 'ORIG=', y)
                      break
              if len(a) != len(b):
                  print('Numero de defines: local', len(a), 'original', len(b))
              raise SystemExit('LEGACY contiene diferencias activas no autorizadas respecto a Moebyus')

          expected = {
              'STRING_CONFIG_H_AUTHOR': '"(SIRIUS 300x300 CUSTOM - odoslf)"',
              'CUSTOM_MACHINE_NAME': '"[SIRIUS 300]"',
              'Y_MAX_POS': '295',
          }
          for name, value in expected.items():
              m = re.search(rf'^\s*#define\s+{name}\s+(.+?)\s*(?://.*)?$', local, re.M)
              if not m or m.group(1).strip() != value:
                  raise SystemExit(f'LEGACY: {name} no tiene el valor esperado {value}')

          moebyus_y = re.search(r'^\s*#define\s+Y_MAX_POS\s+(.+?)\s*(?://.*)?$', orig, re.M)
          if not moebyus_y or moebyus_y.group(1).strip() != '205':
              raise SystemExit('La referencia publica Moebyus ya no coincide con Y_MAX_POS=205')
          print('LEGACY: fuente original conservada; solo identidad y Y_MAX_POS=295 difieren intencionadamente')
          PY

      - name: Verificar que el nucleo MODERNO es Marlin 2.1.2.8 sin parches ocultos
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 2.1.2.8 https://github.com/MarlinFirmware/Marlin.git /tmp/marlin-upstream
          LOCAL='02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8'
          # Solo Configuration.h y Configuration_adv.h deben contener la personalidad Sirius.
          diff -qr --exclude='Configuration.h' --exclude='Configuration_adv.h' "$LOCAL" /tmp/marlin-upstream

      - name: Comprobaciones bloqueantes de configuracion moderna
        shell: bash
        run: |
          set -euxo pipefail
          ROOT='02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8/Marlin'
          C="$ROOT/Configuration.h"
          A="$ROOT/Configuration_adv.h"
          grep -q '^#define X_BED_SIZE 295' "$C"
          grep -q '^#define Y_BED_SIZE 295' "$C"
          grep -q '^#define X_MIN_POS -48' "$C"
          grep -q '^#define Y_MIN_POS -12' "$C"
          grep -q '^#define X_MAX_POS 295' "$C"
          grep -q '^#define Y_MAX_POS 295' "$C"
          grep -q '^#define Z_MAX_POS 275' "$C"
          for D in X Y Z X2 E0 E1; do grep -q "^#define ${D}_DRIVER_TYPE TMC2209_STANDALONE" "$C"; done
          grep -q '^#define DUAL_X_CARRIAGE' "$A"
          grep -q '^#define X2_MIN_POS 25' "$A"
          grep -q '^#define X2_MAX_POS 359' "$A"
          grep -q '^#define DEFAULT_DUPLICATION_X_OFFSET 150' "$A"
          grep -q '^#define SD_FINISHED_STEPPERRELEASE false' "$A"
          ! grep -Eq '^\s*#define\s+EVENT_GCODE_SD_ABORT\b' "$A"
          grep -q '^#define SD_DETECT_STATE HIGH' "$A"
          grep -q '^#define BABYSTEPPING' "$A"
          grep -q '^#define BABYSTEP_XY' "$A"
          grep -q '^#define DOUBLECLICK_FOR_Z_BABYSTEPPING' "$A"
          grep -q '^#define MANUAL_FEEDRATE { 80\*60, 80\*60, 10\*60, 6\*60 }' "$A"
          grep -q '^#define LCD_INFO_MENU' "$A"
          grep -q '^#define LCD_DECIMAL_SMALL_XY' "$A"
          grep -q '^#define USE_BIG_EDIT_FONT' "$A"
          grep -q '^#define ENCODER_10X_STEPS_PER_SEC 75' "$A"
          grep -q '^#define ENCODER_100X_STEPS_PER_SEC 160' "$A"
          grep -q '^#define INDIVIDUAL_AXIS_HOMING_MENU' "$C"
          grep -q '^#define SPEAKER' "$C"
          grep -q '^#define ENCODER_PULSES_PER_STEP 1' "$C"
          grep -q '^#define ENCODER_STEPS_PER_MENU_ITEM 5' "$C"
          grep -q '^#define SD_CHECK_AND_RETRY' "$C"

      - uses: arduino/setup-arduino-cli@v2

      - name: Instalar AVR y U8glib
        shell: bash
        run: |
          set -euxo pipefail
          arduino-cli config init --overwrite
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install U8glib

      - name: Compilar LEGACY RUMBA ATmega2560
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/legacy-build
          arduino-cli compile --fqbn arduino:avr:mega:cpu=atmega2560 --output-dir /tmp/legacy-build 01-LEGACY-MARLIN-1.1.1-CAMA-300x300/Marlin
          test -n "$(find /tmp/legacy-build -maxdepth 1 -name '*.hex' ! -name '*with_bootloader*' -print -quit)"

      - name: Instalar PlatformIO
        run: python3 -m pip install platformio

      - name: Compilar MODERNO RUMBA ATmega2560
        working-directory: 02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8
        run: platformio run -e mega2560

      - name: Actualizar HEX moderno y checksum
        shell: bash
        run: |
          set -euxo pipefail
          DIR='02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300'
          SRC="$DIR/Marlin-2.1.2.8/.pio/build/mega2560/firmware.hex"
          DST="$DIR/firmware/SIRIUS-300x300-IDEX-Marlin-2.1.2.8-RUMBA-TMC2209-standalone.hex"
          test -s "$SRC"
          cp "$SRC" "$DST"
          (cd "$DIR/firmware" && sha256sum SIRIUS-300x300-IDEX-Marlin-2.1.2.8-RUMBA-TMC2209-standalone.hex > SHA256SUMS.txt)

      - name: Guardar resultado auditado en la rama
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8/Marlin/Configuration.h
          git add 02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8/Marlin/Configuration_adv.h
          git add 02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/firmware/
          if ! git diff --cached --quiet; then
            git commit -m 'Aplica auditoria final Sirius y regenera firmware moderno'
            git push origin HEAD:auditoria-final-sirius
          fi
