name: Verificar MODERNO Sirius Marlin 2.1.2.8

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/**'
      - '.github/workflows/verificar-moderno.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/**'
      - '.github/workflows/verificar-moderno.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Probar núcleo oficial Marlin 2.1.2.8 sin parches ocultos
        shell: bash
        run: |
          set -euxo pipefail
          MARLIN_COMMIT='1cd56c4ccd483045eb5a92c99e3ad3b5ab1bea6d'
          git init /tmp/marlin-upstream
          git -C /tmp/marlin-upstream remote add origin https://github.com/MarlinFirmware/Marlin.git
          git -C /tmp/marlin-upstream fetch --depth 1 origin "$MARLIN_COMMIT"
          git -C /tmp/marlin-upstream checkout --detach FETCH_HEAD
          LOCAL='02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8'
          diff -qr --exclude='.git' --exclude='vscode' --exclude='Configuration.h' --exclude='Configuration_adv.h' "$LOCAL" /tmp/marlin-upstream

      - name: Regenerar desde Configuration upstream y exigir igualdad exacta
        shell: bash
        run: |
          set -euxo pipefail
          ROOT='02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300'
          M="$ROOT/Marlin-2.1.2.8/Marlin"
          cp "$M/Configuration.h" /tmp/Configuration.expected.h
          cp "$M/Configuration_adv.h" /tmp/Configuration_adv.expected.h
          cp /tmp/marlin-upstream/Marlin/Configuration.h "$M/Configuration.h"
          cp /tmp/marlin-upstream/Marlin/Configuration_adv.h "$M/Configuration_adv.h"
          python3 "$ROOT/migrar_configuracion.py"
          cmp "$M/Configuration.h" /tmp/Configuration.expected.h
          cmp "$M/Configuration_adv.h" /tmp/Configuration_adv.expected.h
          # Segunda ejecución: también debe ser exactamente idempotente.
          cp "$M/Configuration.h" /tmp/Configuration.once.h
          cp "$M/Configuration_adv.h" /tmp/Configuration_adv.once.h
          python3 "$ROOT/migrar_configuracion.py"
          cmp "$M/Configuration.h" /tmp/Configuration.once.h
          cmp "$M/Configuration_adv.h" /tmp/Configuration_adv.once.h

      - name: Verificar configuración Sirius completa
        shell: bash
        run: |
          set -euxo pipefail
          ROOT='02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300'
          C="$ROOT/Marlin-2.1.2.8/Marlin/Configuration.h"
          A="$ROOT/Marlin-2.1.2.8/Marlin/Configuration_adv.h"
          grep -q 'VARIANTE PERSONALIZADA: MOEBYUS SIRIUS CAMA 300x300 / IDEX' "$C"
          grep -q '^#define MOTHERBOARD BOARD_RUMBA' "$C"; grep -q '^#define SERIAL_PORT 0' "$C"; grep -q '^#define BAUDRATE 115200' "$C"
          ! grep -Eq '^[[:space:]]*#define[[:space:]]+SERIAL_PORT_2\b' "$C"
          grep -q '^#define EXTRUDERS 2' "$C"
          for D in X Y Z X2 E0 E1; do grep -q "^#define ${D}_DRIVER_TYPE TMC2209_STANDALONE" "$C"; done
          grep -q '^#define X_BED_SIZE 295' "$C"; grep -q '^#define Y_BED_SIZE 295' "$C"
          grep -q '^#define X_MIN_POS -48' "$C"; grep -q '^#define Y_MIN_POS -12' "$C"; grep -q '^#define Z_MIN_POS 0' "$C"
          grep -q '^#define X_MAX_POS 295' "$C"; grep -q '^#define Y_MAX_POS 295' "$C"; grep -q '^#define Z_MAX_POS 275' "$C"
          grep -q '^#define DEFAULT_AXIS_STEPS_PER_UNIT { 80.19, 80.19, 400, 96 }' "$C"
          grep -q '^#define DEFAULT_MAX_FEEDRATE { 250, 150, 15, 80 }' "$C"
          grep -q '^#define DEFAULT_MAX_ACCELERATION { 2000, 900, 100, 10000 }' "$C"
          grep -q '^#define TEMP_SENSOR_0 5' "$C"; grep -q '^#define TEMP_SENSOR_1 5' "$C"; grep -q '^#define TEMP_SENSOR_BED 1' "$C"
          grep -q '^#define HEATER_0_MAXTEMP 250' "$C"; grep -q '^#define HEATER_1_MAXTEMP 250' "$C"; grep -q '^#define BED_MAXTEMP 120' "$C"
          grep -q '^#define THERMAL_PROTECTION_HOTENDS' "$C"; grep -q '^#define THERMAL_PROTECTION_BED' "$C"
          grep -q '^#define EEPROM_SETTINGS' "$C"; grep -q '^#define SDSUPPORT' "$C"; grep -q '^#define SD_CHECK_AND_RETRY' "$C"
          grep -q '^#define REPRAP_DISCOUNT_FULL_GRAPHIC_SMART_CONTROLLER' "$C"
          grep -q '^#define INDIVIDUAL_AXIS_HOMING_MENU' "$C"; grep -q '^#define SPEAKER' "$C"
          grep -q '^#define ENCODER_PULSES_PER_STEP 1' "$C"; grep -q '^#define ENCODER_STEPS_PER_MENU_ITEM 5' "$C"
          grep -q '^#define DUAL_X_CARRIAGE' "$A"; grep -q '^#define X2_MIN_POS 25' "$A"; grep -q '^#define X2_MAX_POS 359' "$A"
          grep -q '^#define X2_HOME_POS X2_MAX_POS' "$A"; grep -q '^#define DEFAULT_DUAL_X_CARRIAGE_MODE DXC_AUTO_PARK_MODE' "$A"
          grep -q '^#define DEFAULT_DUPLICATION_X_OFFSET 150' "$A"; grep -q '^#define TOOLCHANGE_ZRAISE 2' "$A"
          grep -q '^#define E0_AUTO_FAN_PIN 6' "$A"; grep -q '^#define E1_AUTO_FAN_PIN 8' "$A"
          grep -q '^#define HOMING_BUMP_MM { 3, 3, 2 }' "$A"; grep -q '^#define QUICK_HOME' "$A"
          grep -q '^#define AUTOTEMP' "$A"; grep -q '^#define USE_WATCHDOG' "$A"; grep -q '^#define ARC_SUPPORT' "$A"
          grep -q '^#define BABYSTEPPING' "$A"; grep -q '^#define BABYSTEP_XY' "$A"; grep -q '^#define DOUBLECLICK_FOR_Z_BABYSTEPPING' "$A"
          grep -q '^#define MANUAL_FEEDRATE { 80\*60, 80\*60, 10\*60, 6\*60 }' "$A"
          grep -q '^#define ENCODER_10X_STEPS_PER_SEC 75' "$A"; grep -q '^#define ENCODER_100X_STEPS_PER_SEC 160' "$A"
          grep -q '^#define LCD_INFO_MENU' "$A"; grep -q '^#define LCD_DECIMAL_SMALL_XY' "$A"; grep -q '^#define USE_BIG_EDIT_FONT' "$A"
          grep -q '^#define SD_DETECT_STATE HIGH' "$A"; grep -q '^#define SD_FINISHED_STEPPERRELEASE false' "$A"
          ! grep -Eq '^[[:space:]]*#define[[:space:]]+EVENT_GCODE_SD_ABORT\b' "$A"

      - name: Verificar mapa de pines RUMBA crítico
        shell: bash
        run: |
          set -euxo pipefail
          P='02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8/Marlin/src/pins/ramps/pins_RUMBA.h'
          check_pin() { grep -Eq "^[[:space:]]*#define[[:space:]]+$1[[:space:]]+$2([[:space:]]|$)" "$P"; }
          check_pin X_STEP_PIN 17; check_pin X_DIR_PIN 16; check_pin X_ENABLE_PIN 48
          check_pin Y_STEP_PIN 54; check_pin Y_DIR_PIN 47; check_pin Y_ENABLE_PIN 55
          check_pin Z_STEP_PIN 57; check_pin Z_DIR_PIN 56; check_pin Z_ENABLE_PIN 62
          check_pin E0_STEP_PIN 23; check_pin E0_DIR_PIN 22; check_pin E0_ENABLE_PIN 24
          check_pin E1_STEP_PIN 26; check_pin E1_DIR_PIN 25; check_pin E1_ENABLE_PIN 27
          check_pin E2_STEP_PIN 29; check_pin E2_DIR_PIN 28; check_pin E2_ENABLE_PIN 39
          check_pin HEATER_0_PIN 2; check_pin HEATER_1_PIN 3; check_pin HEATER_BED_PIN 9
          check_pin X_MIN_PIN 37; check_pin X_MAX_PIN 36; check_pin Y_MIN_PIN 35; check_pin Z_MIN_PIN 33

      - name: Instalar PlatformIO
        run: python3 -m pip install platformio

      - name: Compilar Marlin 2.1.2.8 para RUMBA / ATmega2560
        working-directory: 02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300/Marlin-2.1.2.8
        run: platformio run -e mega2560

      - name: Verificar HEX compilado y checksum versionado
        shell: bash
        run: |
          set -euxo pipefail
          DIR='02-MODERNO-MARLIN-2.1.2.8-SIRIUS-300x300'
          SRC="$DIR/Marlin-2.1.2.8/.pio/build/mega2560/firmware.hex"
          test -s "$SRC"
          cp "$SRC" /tmp/SIRIUS-300x300-IDEX-Marlin-2.1.2.8-RUMBA-TMC2209-standalone.hex
          sha256sum /tmp/SIRIUS-300x300-IDEX-Marlin-2.1.2.8-RUMBA-TMC2209-standalone.hex
          (cd "$DIR/firmware" && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: SIRIUS-MODERNO-Marlin-2.1.2.8-300x300
          path: /tmp/SIRIUS-300x300-IDEX-Marlin-2.1.2.8-RUMBA-TMC2209-standalone.hex
